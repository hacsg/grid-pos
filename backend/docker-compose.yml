services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://grid_pos:grid_pos@db:5432/grid_pos
      JWT_SECRET: local-dev-change-me
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: grid_pos
      POSTGRES_PASSWORD: grid_pos
      POSTGRES_DB: grid_pos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grid_pos -d grid_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
